name: Build playable bundles
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ggg setup --templates
      - run: uv run ggg check --smoke
      - run: uv run ggg build --platform ${{ matrix.platform }}
      # tar preserves executable bits and macOS application bundle structure.
      - run: tar -czf godot-game-gallery-${{ matrix.platform }}.tar.gz -C dist ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-game-gallery-${{ matrix.platform }}
          path: godot-game-gallery-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14
