name: Something is broken
description: Help us reproduce a workshop or game problem
body:
  - type: textarea
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system and hardware
      placeholder: macOS on Apple Silicon, or Linux on x86_64
  - type: textarea
    attributes:
      label: Output of python3 ggg.py doctor
      render: text
