[project]
name = "godot-game-gallery"
version = "0.1.0"
description = "A local-first 2D and 3D game workshop for curious programmers"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
ggg = "tools.ggg:main"

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "gdtoolkit==4.5.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
