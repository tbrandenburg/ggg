[project]
name = "godot-game-gallery"
version = "0.1.0"
description = "A local-first 2D and 3D game workshop for curious programmers"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
