<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">GoDot Game Gallery</title><desc id="desc">A programming workshop for creating independent 2D and 3D games.</desc><rect width="1200" height="300" rx="24" fill="#f5f4ed"/><rect x="48" y="48" width="80" height="80" rx="20" fill="#186d58"/><path d="M88 61L115 88L88 115L61 88Z" fill="#d9edb6"/><rect x="78" y="78" width="20" height="20" rx="5" fill="#186d58"/><text x="156" y="102" fill="#172d36" font-family="sans-serif" font-weight="700" font-size="48">GoDot Game Gallery</text><text x="48" y="192" fill="#172d36" font-family="sans-serif" font-size="30">Small games. Big ideas.</text><text x="48" y="244" fill="#647779" font-family="sans-serif" font-size="21">Create in 2D and 3D. Learn by making something playable.</text><rect x="1000" y="176" width="68" height="68" rx="14" fill="#186d58"/><text x="1015" y="220" fill="white" font-family="sans-serif" font-size="26">2D</text><rect x="1084" y="176" width="68" height="68" rx="14" fill="#172d36"/><text x="1099" y="220" fill="white" font-family="sans-serif" font-size="26">3D</text></svg>